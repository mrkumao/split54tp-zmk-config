# split54tp 左半身(ペリフェラル)専用の設定
#
# シールド名と同名の .conf は、そのシールドでビルドするときだけ読まれる。
# 「片側だけ有効にしたい設定」はここに書くのが正しい置き場所。
#   ・共通 conf に書くと、条件を満たさない側で Kconfig 警告 → ビルド中断になる
#   ・Kconfig.defconfig の default は choice のメンバーには効かない
#     (2026-08-31 に EC11_TRIGGER_GLOBAL_THREAD で経験済み)

# ---------------------------------------------------------------- OLED
#   秋月 112031 / 0.96インチ / SSD1315 / I2C 0x3C / D9(SDA) D10(SCL)
#   ノード定義は split54tp_left.overlay 側にある。
# ★ 2026-09-27 表示を再開。右で表示できた設定 (split54tp_right.conf) と揃える。
#   原因は (1) I2C の連結バッファ不足 (dtsi の zephyr,concat-buf-size で対策) と
#   (2) LVGL 設定の不足 (LV_Z_VDB_SIZE / LV_DPI_DEF を ZMK 公式 sofle に合わせて対策)。
#   経緯は keyboard-project/docs/rev6-課題一覧.md。旧版は .bak-dispon-20260927 ほか。
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148

# ★ 2026-11-01 電池残量をアイコンではなく % で表示する。表示するのは自分側の電池だけ。
#   https://zmk.dev/docs/config/displays
# ★ 2026-11-09 左も自作の画面にしたので外した (右と同じ理由。残すと Kconfig の警告でビルドが止まる)。
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ---------------------------------------------------------------- 自作の画面 (2026-11-09)
#   右と同じ src/display/status_screen.c。接続先・レイヤー・修飾キー・Caps Lock・TP の感度は右から送られてくる
#   (src/behaviors/behavior_oled_sync.c で受ける)。電池 % は左自身のもの。
#   USB の給電中の ⚡ は左でも出る (ZMK 標準の電池の表示と同じ CONFIG_USB_DEVICE_STACK で判断。2026-11-09 修正)。
#   設定の意味は split54tp_right.conf を参照。
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_26=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# ---- LVGL をモノクロ 1bpp にする (2026-09-07 追加) ----
#
# 症状: 画面全体が細かい市松模様になり、文字が出ない。
#       白黒を反転しても見た目が変わらない(市松は反転しても同じに見えるため)。
# 仮説: LVGL が 1bpp 以外の色深度で描画しており、そのバイト列が
#       そのままモノクロのビットマップとして転送されている。
#
# ⚠ LV_COLOR_DEPTH_1 は **choice のメンバー**なので Kconfig.defconfig では設定できない。
#   必ず .conf 側で指定すること。
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1

# ---- I2C のデバッグログ (2026-09-08 / OLED 初期化失敗の調査用) ----
# `ssd1306: Failed to initialize device!` だけでは原因コードが分からないため。
# 調査が済んだら消すこと。
# ★ 2026-10-25 rev.7: 調査は済んだので無効化 (調べ直すときはコメントを外し、build.yaml の左に zmk-usb-logging を足す)
# CONFIG_I2C_LOG_LEVEL_DBG=y
