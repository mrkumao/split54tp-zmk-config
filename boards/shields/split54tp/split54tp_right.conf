# split54tp 右半身(セントラル)専用の設定
# シールド名と同名の .conf は、そのシールドでビルドするときだけ読まれる。

# ---------------------------------------------------------------- OLED (2026-09-26 試験)
#   秋月 112031 / 0.96インチ 128x64 / SSD1315 / I2C 0x3C / D9(SDA) D10(SCL)
#   ノード定義は split54tp_right.overlay。
#   左での不具合 (表示ありで左が機能しない) を踏まえ、表示は最初から専用スレッドで動かす。
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1

# ★ 2026-09-27 ZMK 公式シールド (sofle / SSD1306) の Kconfig.defconfig と同じ LVGL 設定に揃える。
#   砂嵐が続くため、自前の推測をやめて動作実績のある値に合わせる。
#   https://github.com/zmkfirmware/zmk/blob/main/app/boards/shields/sofle/Kconfig.defconfig
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148

# ★ 2026-11-01 電池残量をアイコンではなく % で表示する。表示するのは自分側の電池だけ。
#   https://zmk.dev/docs/config/displays
# ★ 2026-11-08 右は自作の画面にしたので外した。この設定は ZMK 標準の電池の部品 (ZMK_WIDGET_BATTERY_STATUS)
#   があるときだけ使え、自作の画面では標準の部品を使わないので、残すと Kconfig の警告でビルドが止まる。
#   自作の画面は自分で % を出す。
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ---------------------------------------------------------------- 自作の画面 (2026-11-08)
#   src/display/status_screen.c (zmk-config のモジュールとしてビルドする。CMakeLists.txt)。
#   1 行目 = BT の番号と接続 / CAPS / 電池 %、大きく = 接続先 (Mac・Win・iPad・Spare・USB) と右にレイヤー名、
#   修飾キー 4 つ (押している間だけ白抜き)、TP の左右の感度 %。
#   公式の作り方の例: app/boards/shields/nice_view (自作の画面 + LVGL の文字の設定)
#   https://github.com/zmkfirmware/zmk/tree/main/app/boards/shields/nice_view
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# 標準の画面のときは ZMK が自動で有効にしていたもの (app/src/display/Kconfig の imply / select)
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LABEL=y
# 文字: 1 行目 = Montserrat 12、接続先 = Montserrat 26、修飾キー・TP = UNSCII 8 (1 ドット単位の文字。白黒の画面でつぶれにくい)
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_26=y
CONFIG_LV_FONT_UNSCII_8=y
# LVGL の作業用メモリ。公式の nice!view の自作の画面と同じ 8192 (標準の画面は 4096)
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# ---------------------------------------------------------------- Caps Lock の受信 (2026-11-08)
#   パソコンから Caps Lock などのランプの状態を受け取る。OLED の CAPS に使う。
#   ⚠ HID の記述子が変わるので、BT の接続先は「パソコン側の登録を消す → キーボード側の接続先を消す
#     → ペアリングし直す」が要る (Mac・Windows・iPad の全部)。USB は挿し直すだけ。
#   https://zmk.dev/docs/features/bluetooth#refreshing-the-hid-descriptor
#   https://zmk.dev/docs/config/system#hid
CONFIG_ZMK_HID_INDICATORS=y
