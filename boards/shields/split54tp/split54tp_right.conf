# split54tp 右半身(セントラル)専用の設定
#
# シールド名と同名の .conf は、そのシールドでビルドするときだけ読まれる。
# 「片側だけ有効にしたい設定」はここに書くのが正しい置き場所。
#   ・共通 conf に書くと、条件を満たさない側で Kconfig 警告 → ビルド中断になる
#   ・Kconfig.defconfig の default は choice のメンバーには効かない
#     (2026-08-31 に EC11_TRIGGER_GLOBAL_THREAD で経験済み)

# ---- ログを同期モードにする (2026-09-12 追加 / 調査用) ----
#
# 症状: L2 + M (&studio_unlock) を押すと右半身がリセットしブートローダに入る。
#       USB ログには直前の `set_layer_state: layer 2` までしか出ず、
#       M 押下の `zmk_keymap_apply_position_state` すら記録されない。
# 原因: Zephyr の既定は LOG_MODE_DEFERRED。ログは一旦バッファに積まれ
#       別スレッドが USB へ流すため、リセットでバッファごと失われる。
# 対策: IMMEDIATE にして、ログ呼び出しをその場で USB へ書き出す。
#
# ⚠ LOG_MODE_IMMEDIATE は **choice のメンバー**なので Kconfig.defconfig では
#   設定できない。必ず .conf 側で指定すること。
# ⚠ 処理が重くなりタイミングが変わる。調査が済んだら必ず消すこと。
CONFIG_LOG_MODE_IMMEDIATE=y
