# split54tp 共通設定
#
# ★ 現在は「最小構成」です。
#   キーマトリクス(charlieplex) + エンコーダ + マウスキー だけを有効にしています。
#   トラックポイント(LPPS)は入荷待ちのため未有効。
#   OLED は 2026-09-07 に有効化した。
#   段階的に足すことで、問題が起きたときの切り分けが容易になります。

# ---------------------------------------------------------------- 電源管理
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ---------------------------------------------------------------- エンコーダ
# スクロールホイール型。ZMKからは2相インクリメンタル(EC11)として扱う。
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ---------------------------------------------------------------- マウス機能
# キーマップの &mkp (マウスクリック) / &msc (スクロール) に必要。
# これは HID 側の機能なので、ポインティングデバイスが無くても単体で使える。
# ※ 有効化するとHIDディスクリプタが変わるため、BLE接続先で再ペアリングが必要
#    https://zmk.dev/docs/features/bluetooth#refreshing-the-hid-descriptor
CONFIG_ZMK_POINTING=y

# スムーススクロールを使う場合 (使用時は &msc の引数を MOVE_UP/MOVE_DOWN に変更)
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ---------------------------------------------------------------- USB出力
# ⚠ CONFIG_ZMK_USB はここ(共通conf)に書いてはいけない。
#   依存条件が (!ZMK_SPLIT || (ZMK_SPLIT && ZMK_SPLIT_ROLE_CENTRAL)) のため、
#   左(ペリフェラル)では満たせず
#     "was assigned the value 'y' but got the value 'n'"
#   という Kconfig 警告になり、ビルドが中断する (2026-08-31 に遭遇)。
#   → 右シールド限定で Kconfig.defconfig 側に置くこと。
#   USBでキー入力を送れるのは右(セントラル)だけ。左はUSBを挿しても充電のみ。
#   実行中の出力先は &out OUT_USB / OUT_BLE / OUT_TOG で切替。

# ---------------------------------------------------------------- BLE
# 左右間の接続を安定させるため送信出力を上げる
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ================================================================
# ここから下は「後で有効にする」項目。今はすべて無効。
# ================================================================

# ---- 状態モニタ用 OLED ----
#   秋月 112031 / 0.96インチ 128x64 / SSD1315 / I2C 0x3C
#   接続: GND / VDD=3V3 / SCK=D10(P1.15) / SDA=D9(P1.14)
#
# ⚠ 表示系の CONFIG は **この共通 conf に書いてはいけない**。
#   ここに書くと OLED を繋いでいない側でも有効になり、
#   さらに ZMK_DISPLAY_BLANK_ON_IDLE のような「表示が有効な時だけ存在する」
#   シンボルが依存を満たせず
#     "was assigned the value 'y' but got the value 'n'"
#   という Kconfig 警告 → ビルド中断になる (2026-08-31 に ZMK_USB で同じ事故)。
#   → boards/shields/split54tp/Kconfig.defconfig のシールド別ブロックに置くこと。
#     Kconfig.defconfig の default は依存を満たさない側では単に無視され、警告にならない。
#
# 現在の状態: **左(ペリフェラル)だけ有効**。検証が済んだら右にも展開する。

# ---- ポインティングスティック (低消費電力I2C版 / lpps) ----
# 導入時は config/west.yml にモジュールを追加したうえで有効化する。
# https://github.com/sekigon-gonnoc/zmk-driver-lpps
#
# CONFIG_I2C=y
# CONFIG_INPUT=y

# ---- デバッグ (電池消費が増えるので常用しない) ----
# CONFIG_ZMK_USB_LOGGING=y
